name: Windows Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-publish-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontendwebapp/package-lock.json
            desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install JavaScript dependencies
        shell: pwsh
        run: |
          npm ci
          npm ci --prefix frontendwebapp
          npm ci --prefix desktop

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m venv venv
          .\venv\Scripts\python.exe -m pip install --upgrade pip
          .\venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Build Windows installer
        shell: pwsh
        run: node ./scripts/finledge.mjs desktop-build

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the assets generated by electron-builder in desktop/release
          $exePath = Get-ChildItem -Path "desktop\release" -Filter "Finledge-Setup-*.exe" | Select-Object -ExpandProperty FullName
          $ymlPath = "desktop\release\latest.yml"
          $blockmapPath = Get-ChildItem -Path "desktop\release" -Filter "*.blockmap" | Select-Object -ExpandProperty FullName

          # Delete existing release for this tag to prevent duplicates/errors
          Write-Host "Cleaning up any existing release for tag ${{ github.ref_name }}..."
          gh release delete "${{ github.ref_name }}" --yes 2>$null || Write-Host "No existing release found."

          # Create a fresh release and upload all assets
          Write-Host "Creating new release..."
          gh release create "${{ github.ref_name }}" $exePath $ymlPath $blockmapPath --title "FinLedge ${{ github.ref_name }}" --generate-notes
